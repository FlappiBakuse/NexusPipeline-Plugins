name: Build stable plugin candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only candidate build or publish an existing candidate
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - publish-only
      source_ref:
        description: Main-reachable source commit/ref for candidate mode
        required: false
        default: main
        type: string
      candidate_run_id:
        description: Original successful stable candidate run ID for publish-only recovery
        required: false
        type: string
      candidate_artifact_id:
        description: Artifact ID when the run has multiple successful candidates
        required: false
        type: string
      reuse_candidate_run_id:
        description: Prior validated candidate run for bounded baseline refresh reuse
        required: false
        type: string
      reuse_candidate_artifact_id:
        description: Artifact ID when the reusable run has multiple candidates
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-stable-publish
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and validate Plugins candidate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'candidate')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      status: ${{ steps.build.outputs.status || steps.scope.outputs.status }}
      source_sha: ${{ steps.build.outputs.source_sha || steps.scope.outputs.source_sha }}
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - name: Validate candidate operation before checkout
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          REUSE_RUN_ID: ${{ inputs.reuse_candidate_run_id }}
          REUSE_ARTIFACT_ID: ${{ inputs.reuse_candidate_artifact_id }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Candidate controller must run from main' }
          if (-not $env:SOURCE_REF) { throw 'candidate requires source_ref' }
          if ($env:CANDIDATE_RUN_ID -or $env:CANDIDATE_ARTIFACT_ID) { throw 'candidate mode does not accept publish-only inputs' }
          if ($env:REUSE_ARTIFACT_ID -and -not $env:REUSE_RUN_ID) { throw 'reuse artifact requires reuse_candidate_run_id' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins-Control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
          path: NexusPipeline-Plugins
          fetch-depth: 0
          persist-credentials: false
      - name: Require source reachable from protected main
        working-directory: NexusPipeline-Plugins
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve protected main' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source is not reachable from main' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Classify cumulative stable delta
        id: scope
        shell: pwsh
        run: python ../NexusPipeline-Plugins-Control/tools/repository.py candidate-scope --root . --github-output $env:GITHUB_OUTPUT
      - name: Resolve reusable original candidate
        if: steps.scope.outputs.needs_build == 'true' && inputs.reuse_candidate_run_id != ''
        id: reuse
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_candidate_run_id }}
          REUSE_ARTIFACT_ID: ${{ inputs.reuse_candidate_artifact_id }}
        run: |
          $arguments = @('--candidate-run-id', $env:REUSE_RUN_ID, '--current-run-id', $env:GITHUB_RUN_ID, '--github-output', $env:GITHUB_OUTPUT)
          if ($env:REUSE_ARTIFACT_ID) { $arguments += @('--artifact-id', $env:REUSE_ARTIFACT_ID) }
          python ../NexusPipeline-Plugins-Control/tools/repository_candidate_source.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Reusable candidate source was not verifiable' }
      - name: Download byte-verified reusable candidate
        if: steps.reuse.outputs.artifact_id != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.reuse.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.reuse.outputs.artifact_digest }}
        run: |
          New-Item -ItemType Directory -Path '.generated' -Force | Out-Null
          $uri = "https://api.github.com/repos/FlappiBakuse/NexusPipeline-Plugins/actions/artifacts/$env:ARTIFACT_ID/zip"
          curl.exe -fsSL --connect-timeout 10 --max-time 60 --retry 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/octet-stream' --output '.generated/reuse-candidate.zip' $uri
          if ($LASTEXITCODE -ne 0) { throw 'Reusable candidate download failed' }
          python ../NexusPipeline-Plugins-Control/tools/repository.py extract-candidate --artifact-zip '.generated/reuse-candidate.zip' --expected-digest $env:ARTIFACT_DIGEST --output '.generated/reuse-candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Reusable candidate artifact failed validation' }
      - name: Bind reusable candidate to its original trusted producer
        if: steps.reuse.outputs.artifact_id != ''
        shell: pwsh
        run: >-
          python ../NexusPipeline-Plugins-Control/tools/repository.py inspect-candidate
          --generated-root .generated/reuse-candidate
          --workflow-sha '${{ steps.reuse.outputs.workflow_sha }}'
          --run-id '${{ steps.reuse.outputs.run_id }}'
          --run-attempt '${{ steps.reuse.outputs.run_attempt }}'
          --github-output $env:GITHUB_OUTPUT
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.scope.outputs.needs_build == 'true'
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: steps.scope.outputs.needs_build == 'true'
        with:
          dotnet-version: "8.0.424"
      - name: Resolve fixed official Host SDK
        if: steps.scope.outputs.needs_build == 'true'
        id: host
        shell: pwsh
        run: |
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline.git refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Cannot resolve official Host main' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Host SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.scope.outputs.needs_build == 'true'
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host.outputs.sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: Build and verify cumulative candidate
        if: steps.scope.outputs.needs_build == 'true'
        id: build
        shell: pwsh
        run: |
          $arguments = @('candidate', '--root', '.', '--host-root', '../NexusPipeline',
            '--sdk-sha', '${{ steps.host.outputs.sha }}', '--workflow-sha', '${{ github.workflow_sha }}',
            '--run-id', '${{ github.run_id }}', '--run-attempt', '${{ github.run_attempt }}',
            '--output', '.generated/stable-candidate', '--github-output', $env:GITHUB_OUTPUT)
          if (Test-Path -LiteralPath '.generated/reuse-candidate') { $arguments += @('--reuse-candidate', '.generated/reuse-candidate') }
          python ../NexusPipeline-Plugins-Control/tools/repository.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Stable candidate build failed' }
      - name: Upload validated candidate
        if: steps.build.outputs.status == 'VALIDATED'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline-Plugins/.generated/stable-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish-only:
    name: Publish original Plugins candidate
    needs: candidate
    if: always() && ((github.event_name == 'push' && needs.candidate.result == 'success' && needs.candidate.outputs.status == 'VALIDATED') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-only'))
    runs-on: windows-latest
    environment: plugin-stable-publish
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Resolve original successful producer and artifact
        id: source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publisher control must run from main' }
          if (-not $env:CANDIDATE_RUN_ID) { throw 'publish-only requires candidate_run_id' }
          $arguments = @('--candidate-run-id', $env:CANDIDATE_RUN_ID, '--current-run-id', $env:GITHUB_RUN_ID, '--github-output', $env:GITHUB_OUTPUT)
          if ($env:CANDIDATE_ARTIFACT_ID) { $arguments += @('--artifact-id', $env:CANDIDATE_ARTIFACT_ID) }
          python tools/repository_candidate_source.py @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Original candidate source was not verifiable' }
      - name: Download artifact and verify server digest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.source.outputs.artifact_digest }}
        run: |
          New-Item -ItemType Directory -Path '.generated' -Force | Out-Null
          $uri = "https://api.github.com/repos/FlappiBakuse/NexusPipeline-Plugins/actions/artifacts/$env:ARTIFACT_ID/zip"
          curl.exe -fsSL --connect-timeout 10 --max-time 60 --retry 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/octet-stream' --output '.generated/stable-candidate-artifact.zip' $uri
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact download failed' }
          python tools/repository.py extract-candidate --artifact-zip '.generated/stable-candidate-artifact.zip' --expected-digest $env:ARTIFACT_DIGEST --output '.generated/stable-candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact failed server digest or path validation' }
      - name: Inspect original candidate identity before source checkout
        id: candidate
        shell: pwsh
        run: >-
          python tools/repository.py inspect-candidate
          --generated-root .generated/stable-candidate
          --workflow-sha '${{ steps.source.outputs.workflow_sha }}'
          --run-id '${{ steps.source.outputs.run_id }}'
          --run-attempt '${{ steps.source.outputs.run_attempt }}'
          --github-output $env:GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          path: NexusPipeline-Plugins-Source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source, producer, distribution and package bytes
        shell: pwsh
        run: >-
          python tools/repository.py validate-candidate
          --root ../NexusPipeline-Plugins-Source
          --generated-root .generated/stable-candidate
          --source-sha '${{ steps.candidate.outputs.source_sha }}'
          --workflow-sha '${{ steps.source.outputs.workflow_sha }}'
          --run-id '${{ steps.source.outputs.run_id }}'
          --run-attempt '${{ steps.source.outputs.run_attempt }}'
      - name: Create publisher App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PLUGIN_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-contents: write
      - name: Publish exact validated candidate without rebuilding
        shell: pwsh
        env:
          PLUGIN_PUBLISHER_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python tools/repository.py publish-candidate
          --root ../NexusPipeline-Plugins-Source
          --generated-root .generated/stable-candidate
          --source-sha '${{ steps.candidate.outputs.source_sha }}'
          --workflow-sha '${{ steps.source.outputs.workflow_sha }}'
          --run-id '${{ steps.source.outputs.run_id }}'
          --run-attempt '${{ steps.source.outputs.run_attempt }}'
          --remote-write --token-env PLUGIN_PUBLISHER_TOKEN
