name: Plugins 稳定发行
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [candidate, publish-only]
        default: candidate
        required: true
      source_commit:
        description: 完整插件源码 SHA
        type: string
      host_commit:
        description: 完整 Host main 来源 SHA
        type: string
      distribution_commit:
        description: 完整 Plugins main 发行状态 SHA
        type: string
      candidate_run_id:
        description: 原成功候选运行 ID
        type: string
      candidate_artifact_id:
        description: 原候选 artifact ID
        type: string
      publish:
        description: 写入已验证的原候选
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: plugins-stable-publication
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  candidate:
    name: Plugins / 发行装配
    if: github.ref == 'refs/heads/main' && inputs.operation == 'candidate'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: 校验输入
        shell: pwsh
        env:
          SOURCE: ${{ inputs.source_commit }}
          HOST: ${{ inputs.host_commit }}
          DISTRIBUTION: ${{ inputs.distribution_commit }}
          RUN: ${{ inputs.candidate_run_id }}
          ARTIFACT: ${{ inputs.candidate_artifact_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          foreach ($value in @($env:SOURCE, $env:HOST, $env:DISTRIBUTION)) {
            if ($value -cnotmatch '^[0-9a-f]{40}$') { throw 'Full source SHA required' }
          }
          if ($env:RUN -or $env:ARTIFACT -or $env:PUBLISH -eq 'true') { throw 'Candidate does not publish' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          path: Source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ inputs.host_commit }}
          path: Host
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.distribution_commit }}
          path: Distribution
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: Host/global.json
      - name: 构建原始候选
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source_commit }}
          HOST: ${{ inputs.host_commit }}
          DISTRIBUTION: ${{ inputs.distribution_commit }}
        run: |
          python Control/tooling/plugin_release_build.py --channel stable --source-root "$env:GITHUB_WORKSPACE/Source" --host-root "$env:GITHUB_WORKSPACE/Host" --distribution-root "$env:GITHUB_WORKSPACE/Distribution" --source-commit $env:SOURCE --host-commit $env:HOST --distribution-commit $env:DISTRIBUTION --output "$env:RUNNER_TEMP/release"
          exit $LASTEXITCODE
      - name: 保存原候选
        if: steps.build.outputs.candidate == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: 保存构建证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/build.json
            ${{ runner.temp }}/release/*.log
          if-no-files-found: warn
  publisher:
    name: Plugins / 稳定发布
    if: github.ref == 'refs/heads/main' && inputs.operation != 'candidate'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    environment: plugin-stable-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 创建 Publisher App 令牌
        if: inputs.publish
        id: publisher-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PLUGIN_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-contents: write
      - name: 验证并应用原候选
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.candidate_run_id }}
          ARTIFACT: ${{ inputs.candidate_artifact_id }}
          PUBLISH: ${{ inputs.publish }}
          SOURCE: ${{ inputs.source_commit }}
          HOST: ${{ inputs.host_commit }}
          DISTRIBUTION: ${{ inputs.distribution_commit }}
          NEXUS_PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          if ($env:SOURCE -or $env:HOST -or $env:DISTRIBUTION) { throw 'Writer accepts original candidate identities only' }
          if ($env:RUN -notmatch '^[1-9][0-9]*$') { throw 'Original run ID required' }
          $arguments = @('Control/tooling/plugin_release_check.py', '--run-id', $env:RUN, '--writer-id', $env:GITHUB_RUN_ID, '--output', "$env:RUNNER_TEMP/publication")
          if ($env:ARTIFACT) {
            if ($env:ARTIFACT -notmatch '^[1-9][0-9]*$') { throw 'Invalid artifact ID' }
            $arguments += @('--artifact-id', $env:ARTIFACT)
          }
          if ($env:PUBLISH -eq 'true') { $arguments += '--publish' }
          python @arguments
          exit $LASTEXITCODE
      - name: 保存发布回执
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication/provenance.json
            ${{ runner.temp }}/publication/result.json
          if-no-files-found: warn

