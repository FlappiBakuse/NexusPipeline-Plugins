name: Build stable plugin candidate

on:
  push:
    branches:
      - main
    paths-ignore:
      - catalog.json
      - .release-state.json
      - packages/**
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged source SHA with completed Plugin Release Qualification
        required: true
        type: string
      pr_number:
        description: Same-repository merged PR carrying the qualified source
        required: false
        type: string
      merged_sha:
        description: Squash merge commit M for manual promotion
        required: false
        type: string
      base_sha:
        description: Historical qualification base B for manual promotion
        required: false
        type: string
      head_sha:
        description: Qualified PR head H for manual promotion
        required: false
        type: string
      check_id:
        description: Qualification App check id for manual promotion
        required: false
        type: string
      qualification_run_id:
        description: Completed qualification Actions run id
        required: false
        type: string
      qualification_app_id:
        description: Qualification App id
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-stable-publish
  cancel-in-progress: false

jobs:
  resolve-qualification:
    name: resolve-qualification
    runs-on: ubuntu-latest
    environment: qualification-control
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      check_id: ${{ steps.resolve.outputs.check_id }}
      qualification_app_id: ${{ steps.resolve.outputs.qualification_app_id }}
      qualification_run_id: ${{ steps.resolve.outputs.qualification_run_id }}
      qualification_run_attempt: ${{ steps.resolve.outputs.qualification_run_attempt }}
      workflow_sha: ${{ steps.resolve.outputs.workflow_sha }}
      sdk_sha: ${{ steps.resolve.outputs.sdk_sha }}
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Create qualification App token
        id: qualification-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.QUALIFICATION_APP_ID }}
          private-key: ${{ secrets.QUALIFICATION_APP_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - name: Resolve and verify immutable qualification
        id: resolve
        env:
          QUALIFICATION_TOKEN: ${{ steps.qualification-token.outputs.token }}
          QUALIFICATION_APP_ID: ${{ inputs.qualification_app_id || vars.QUALIFICATION_APP_ID }}
          MERGED_SHA: ${{ inputs.merged_sha || inputs.source_sha || github.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_CHECK_ID: ${{ inputs.check_id }}
          INPUT_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python tools/qualification_control.py resolve-main-queue \
              --merged-sha "$MERGED_SHA" \
              --app-id "$QUALIFICATION_APP_ID" \
              --token-env QUALIFICATION_TOKEN > resolved.json
          else
            test -n "$INPUT_PR_NUMBER"
            test -n "$INPUT_BASE_SHA"
            test -n "$INPUT_HEAD_SHA"
            test -n "$INPUT_CHECK_ID"
          test -n "$INPUT_RUN_ID"
            python tools/qualification_control.py verify-merged \
              --pr-number "$INPUT_PR_NUMBER" \
              --merged-sha "$MERGED_SHA" \
              --base-sha "$INPUT_BASE_SHA" \
              --head-sha "$INPUT_HEAD_SHA" \
              --check-id "$INPUT_CHECK_ID" \
              --app-id "$QUALIFICATION_APP_ID" \
              --run-id "$INPUT_RUN_ID" \
              --token-env QUALIFICATION_TOKEN > resolved.json
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          with open("resolved.json", encoding="utf-8") as stream:
              value = json.load(stream)
          outputs = {
              "source_sha": value["mergedSha"],
              "base_sha": value["baseSha"],
              "head_sha": value["headSha"],
              "pr_number": value.get("prNumber") or os.environ.get("INPUT_PR_NUMBER", ""),
              "check_id": value["checkId"],
              "qualification_app_id": value.get("qualificationAppId", value["appId"]),
              "qualification_run_id": value["runId"],
              "qualification_run_attempt": value["runAttempt"],
              "workflow_sha": value["workflowSha"],
              "sdk_sha": value["sdkSourceSha"],
          }
          for key, item in outputs.items():
              print(f"{key}={item}")
          PY

  build-candidate:
    name: stable-candidate
    needs: resolve-qualification
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-qualification.outputs.source_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.424"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ needs.resolve-qualification.outputs.sdk_sha }}
          path: NexusPipeline
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve immutable source identity
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          if ($head -notmatch '^[0-9a-f]{40}$') { throw "候选 checkout 未解析为完整 SHA" }
          if ($head -ne "${{ needs.resolve-qualification.outputs.source_sha }}") { throw "候选 checkout 与资格 source SHA 不一致" }
          "sha=$head" >> $env:GITHUB_OUTPUT
      - name: Build isolated stable candidate
        run: >-
          python tools/repository.py qualification --group candidate
          --base "${{ needs.resolve-qualification.outputs.base_sha }}"
          --host-root ..\NexusPipeline
          --sdk-sha "${{ needs.resolve-qualification.outputs.sdk_sha }}"
          --output .generated\stable-candidate
      - name: Bind candidate to qualification producer
        run: >-
          python tools/repository.py write-stable-producer
          --generated-root .generated\stable-candidate
          --source-sha "${{ needs.resolve-qualification.outputs.source_sha }}"
          --base-sha "${{ needs.resolve-qualification.outputs.base_sha }}"
          --run-id "${{ needs.resolve-qualification.outputs.qualification_run_id }}"
          --run-attempt "${{ needs.resolve-qualification.outputs.qualification_run_attempt }}"
          --workflow-sha "${{ needs.resolve-qualification.outputs.workflow_sha }}"
          --qualification-app-id "${{ needs.resolve-qualification.outputs.qualification_app_id }}"
          --qualification-check-id "${{ needs.resolve-qualification.outputs.check_id }}"
      - name: Verify candidate source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "${{ steps.source.outputs.sha }}") { throw "候选 checkout SHA 与 source_sha 不一致" }
      - name: Upload candidate for separately authorized publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-stable-candidate-${{ steps.source.outputs.sha }}
          path: NexusPipeline-Plugins/.generated/stable-candidate
          if-no-files-found: error
          retention-days: 14

  publish-candidate:
    name: stable-publish
    needs: [resolve-qualification, build-candidate]
    runs-on: ubuntu-latest
    environment: plugin-stable-publish
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-qualification.outputs.source_sha }}
          path: NexusPipeline-Plugins-Source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plugins-stable-candidate-${{ needs.build-candidate.outputs.source_sha }}
          path: NexusPipeline-Plugins/.generated/stable-candidate
      - name: Create qualification App token
        id: qualification-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.QUALIFICATION_APP_ID }}
          private-key: ${{ secrets.QUALIFICATION_APP_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
      - name: Reverify completed Plugin Release Qualification
        env:
          QUALIFICATION_TOKEN: ${{ steps.qualification-token.outputs.token }}
        run: >-
          python tools/qualification_control.py verify-merged
          --pr-number "${{ needs.resolve-qualification.outputs.pr_number }}"
          --merged-sha "${{ needs.resolve-qualification.outputs.source_sha }}"
          --base-sha "${{ needs.resolve-qualification.outputs.base_sha }}"
          --head-sha "${{ needs.resolve-qualification.outputs.head_sha }}"
          --check-id "${{ needs.resolve-qualification.outputs.check_id }}"
          --app-id "${{ needs.resolve-qualification.outputs.qualification_app_id }}"
          --run-id "${{ needs.resolve-qualification.outputs.qualification_run_id }}"
          --token-env QUALIFICATION_TOKEN
      - name: Create publisher App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PLUGIN_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-contents: write
      - name: Publish stable candidate with immutable source identity
        env:
          PLUGIN_PUBLISHER_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python tools/repository.py publish-stable
          --root ../NexusPipeline-Plugins-Source
          --source-sha "${{ needs.resolve-qualification.outputs.source_sha }}"
          --base-sha "${{ needs.resolve-qualification.outputs.base_sha }}"
          --generated-root .generated/stable-candidate
          --run-id "${{ needs.resolve-qualification.outputs.qualification_run_id }}"
          --run-attempt "${{ needs.resolve-qualification.outputs.qualification_run_attempt }}"
          --workflow-sha "${{ needs.resolve-qualification.outputs.workflow_sha }}"
          --qualification-app-id "${{ needs.resolve-qualification.outputs.qualification_app_id }}"
          --qualification-check-id "${{ needs.resolve-qualification.outputs.check_id }}"
          --remote-write --token-env PLUGIN_PUBLISHER_TOKEN
