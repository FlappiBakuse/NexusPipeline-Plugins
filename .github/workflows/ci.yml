name: Plugins CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: plugins-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required:
    name: Plugins / Required
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Resolve Host SDK source
        id: host
        shell: pwsh
        run: |
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline.git refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Cannot resolve official Host main' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid official Host SHA' }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host.outputs.sha }}
          path: .generated/host-sdk
          persist-credentials: false
      # Maa 原生测试输入约 600 MiB 且有锁定摘要；缓存按锁文件内容失效。
      - name: Cache Maa native inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .generated/maa-native-tests
          key: maa-native-${{ runner.os }}-${{ hashFiles('plugins/general/MaaFrameworkDriver/native-tests.lock.json', 'plugins/general/MaaFrameworkDriver/official-projects.lock.json') }}
      - name: Run source and managed checks
        run: >-
          python tools/repository.py verify --scope all
          --base '${{ github.event.pull_request.base.sha }}'
          --host-root '.generated/host-sdk'
          --sdk-sha '${{ steps.host.outputs.sha }}'
