name: Plugins CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: Plugins / Required
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify PR merge checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = '${{ github.sha }}'
          $parents = ((git show -s --format=%P HEAD).Trim() -split ' ')
          if ($actual -ne $expected -or $parents.Count -ne 2 -or
              $parents[0] -ne '${{ github.event.pull_request.base.sha }}' -or
              $parents[1] -ne '${{ github.event.pull_request.head.sha }}') {
            throw "PR merge checkout identity mismatch: $actual"
          }
          Write-Output "merge=$actual base=$($parents[0]) head=$($parents[1])"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Classify scope
        id: scope
        shell: pwsh
        run: python tools/repository.py scope --base '${{ github.event.pull_request.base.sha }}' --github-output $env:GITHUB_OUTPUT
      - name: Run documentation checks
        if: steps.scope.outputs.docs_only == 'true'
        run: python tools/repository.py verify --scope docs --base '${{ github.event.pull_request.base.sha }}'
      - name: Resolve Host SDK source
        if: steps.scope.outputs.docs_only != 'true'
        id: host
        shell: pwsh
        run: |
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline.git refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Cannot resolve official Host main' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid official Host SHA' }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "host-sdk=$sha"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.scope.outputs.docs_only != 'true'
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host.outputs.sha }}
          path: .generated/host-sdk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: steps.scope.outputs.docs_only != 'true'
        with:
          dotnet-version: "8.0.x"
      - name: Run source and scoped managed checks
        if: steps.scope.outputs.docs_only != 'true'
        run: >-
          python tools/repository.py verify --scope all
          --base '${{ github.event.pull_request.base.sha }}'
          --host-root '.generated/host-sdk'
          --sdk-sha '${{ steps.host.outputs.sha }}'
  audit:
    name: Audit Plugins
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python tools/repository.py audit --full
