name: Plugins CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: plugins-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Plugins / 范围判定
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      hostSha: ${{ steps.plan.outputs.hostSha }}
    steps:
      - name: 检出完整源码与基线
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Plugins
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 选择受影响门禁与固定宿主
        id: plan
        working-directory: Plugins
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCOPE_RESULT: ${{ runner.temp }}/scope.json
        run: node tests/ci-scope.mjs
      - name: 保存范围计划
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scope
          path: ${{ runner.temp }}/scope.json
          if-no-files-found: error
          retention-days: 7

  gates:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 3
    env:
      NEXUS_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.key }}
      NEXUS_MAA_NATIVE_ROOT: ${{ runner.temp }}/maa-native
    steps:
      - name: 检出本次插件源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Plugins
          persist-credentials: false
      - name: 检出固定宿主输入
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ needs.scope.outputs.hostSha }}
          path: Host
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 准备 .NET 工具链
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: 准备锁定 Maa 运行库
        if: contains(matrix.id, 'MaaFrameworkDriver') && (contains(matrix.id, '.adapter:') || contains(matrix.id, '.capability:'))
        working-directory: Plugins
        shell: pwsh
        run: python tests/bootstrap-native.py --output "$env:NEXUS_MAA_NATIVE_ROOT"
      - name: 验证独立插件门禁
        working-directory: Plugins
        shell: pwsh
        run: node tests/run.mjs gate --id '${{ matrix.id }}' --host-root "$env:GITHUB_WORKSPACE/Host"
      - name: 保存原生报告与门禁结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-gate-${{ matrix.key }}
          path: ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}
          if-no-files-found: error
          retention-days: 7

  required:
    name: Plugins / Required
    needs: [scope, gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 检出汇总策略
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Plugins
          persist-credentials: false
      - name: 下载范围与原生报告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/reports
      - name: 核验来源、用例与完整前序耗时
        working-directory: Plugins
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python tests/gate-required.py . '${{ runner.temp }}/reports'
