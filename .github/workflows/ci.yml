name: Plugins 持续集成
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  actions: read
concurrency:
  group: plugins-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    name: Plugins / 范围判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      control: ${{ steps.plan.outputs.control }}
      partnerSha: ${{ steps.plan.outputs.partnerSha }}
    steps:
      - name: 检出完整源码与基线
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Plugins
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 准备配对输入工具链
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 选择受影响门禁
        id: plan
        working-directory: Plugins
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCOPE_RESULT: ${{ runner.temp }}/scope.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/ci/scope.mjs
      - name: 保存范围计划
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scope.json
          if-no-files-found: error
          retention-days: 7
  control:
    name: Plugins / 控制检查
    needs: scope
    if: needs.scope.outputs.control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXUS_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-control
    steps:
      - name: 记录任务预算起点
        run: echo "NEXUS_TEST_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: 检出完整源码与基线
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Plugins
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 下载范围计划
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scope
      - name: 执行选中控制检查
        working-directory: Plugins
        env:
          NEXUS_PARTNER_ROOT: ""
        run: node tests/run.mjs batch --plan '${{ runner.temp }}/scope/scope.json' --batch control
      - name: 保存原生报告与清理证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-${{ github.run_id }}-${{ github.run_attempt }}-control
          path: ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}
          if-no-files-found: error
          retention-days: 7
  batches:
    name: ${{ matrix.name || 'Plugins / 验证批次（未选中）' }}
    needs: scope
    if: needs.scope.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      NEXUS_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
    steps:
      - name: 记录任务预算起点
        shell: pwsh
        run: '"NEXUS_TEST_JOB_STARTED_AT_MS=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" >> $env:GITHUB_ENV'
      - name: 检出完整源码与基线
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Plugins
          fetch-depth: 0
          persist-credentials: false
      - name: 检出固定宿主 SDK
        if: matrix.partnerRequired
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ needs.scope.outputs.partnerSha }}
          path: Host
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 准备 .NET 工具链
        if: matrix.dotnetRequired
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: Plugins/global.json
      - name: 下载范围计划
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scope
      - name: 执行选中验证批次
        working-directory: Plugins
        shell: pwsh
        run: |
          $arguments = @('tests/run.mjs', 'batch', '--plan', "$env:RUNNER_TEMP/scope/scope.json", '--batch', '${{ matrix.id }}')
          if ('${{ matrix.partnerRequired }}' -eq 'true') { $arguments += @('--host-root', "$env:GITHUB_WORKSPACE/Host") }
          node @arguments
      - name: 保存原生报告与清理证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ runner.temp }}/NexusPipeline.Tests/runs/${{ env.NEXUS_TEST_RUN_ID }}
          if-no-files-found: error
          retention-days: 7
  required:
    name: Plugins / 必需汇总
    needs: [scope, control, batches]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 记录任务预算起点
        run: echo "NEXUS_TEST_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: 检出完整源码与基线
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Plugins
          fetch-depth: 0
          persist-credentials: false
      - name: 准备 Node 工具链
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 下载本次全部验证报告
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/reports
      - name: 核验门禁报告与完整任务预算
        working-directory: Plugins
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEXUS_PARTNER_ROOT: ""
        run: python tests/ci/required.py . '${{ runner.temp }}/reports'
