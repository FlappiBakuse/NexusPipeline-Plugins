name: Validate plugins

on:
  # classifier 必须先看到所有 PR，未知路径才能保守回退到源码门禁。
  pull_request: {}
  workflow_dispatch:
    inputs:
      host_ref:
        description: Candidate host full commit SHA; empty uses host.lock.json
        required: false
        type: string

permissions:
  contents: read

jobs:
  # 变更路径分域：changes 输出四个 Gate 的执行开关，未知路径回退到 plugin-source。
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.classify.outputs.source }}
      frontend: ${{ steps.classify.outputs.frontend }}
      managed: ${{ steps.classify.outputs.managed }}
      package: ${{ steps.classify.outputs.package }}
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: NexusPipeline-Plugins
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Classify changed paths
        id: classify
        working-directory: NexusPipeline-Plugins
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python tools/change_classifier.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$GITHUB_SHA"

  # 源码契约 Gate：manifest / data / locales / 语法 / 仓库 Python 单元测试 / PR 生成物拦截。
  plugin-source:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: NexusPipeline-Plugins
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read host lock
        id: host-lock
        working-directory: NexusPipeline-Plugins
        env:
          NEXUS_CANDIDATE_HOST_REF: ${{ inputs.host_ref }}
        run: python tools/read_host_lock.py

      - name: Checkout locked host locale registry
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host-lock.outputs.ref }}
          path: NexusPipeline-LocaleRegistry
          fetch-depth: 1

      - name: Reject contributor generated files
        if: github.event_name == 'pull_request'
        working-directory: NexusPipeline-Plugins
        run: python tools/repository.py check-pr --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate source contracts
        working-directory: NexusPipeline-Plugins
        run: python tools/repository.py validate-source

      - name: Validate host locale registry synchronization
        working-directory: NexusPipeline-Plugins
        run: python tools/repository.py validate-host-locales --host-root ../NexusPipeline-LocaleRegistry

      - name: Validate script syntax
        working-directory: NexusPipeline-Plugins
        run: python tools/repository.py check-syntax

      - name: Test repository tools
        working-directory: NexusPipeline-Plugins
        run: python -m unittest discover -s tools/tests -v

  # 前端 Gate：前端工作区安装、配置编辑脚本行为、Frontend API conformance。
  plugin-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: NexusPipeline-Plugins
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read host lock
        id: host-lock
        working-directory: NexusPipeline-Plugins
        env:
          NEXUS_CANDIDATE_HOST_REF: ${{ inputs.host_ref }}
        run: python tools/read_host_lock.py

      - name: Checkout locked host repository
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host-lock.outputs.ref }}
          path: NexusPipeline
          fetch-depth: 1

      - name: Install host frontend
        working-directory: NexusPipeline/frontend
        run: npm ci --no-audit --no-fund

      - name: Install frontend workspace
        working-directory: NexusPipeline-Plugins
        run: npm ci --no-audit --no-fund

      - name: Test configuration editors
        working-directory: NexusPipeline-Plugins
        run: node tools/Test-ConfigEditors.mjs

      - name: Test frontend plugins
        working-directory: NexusPipeline-Plugins
        run: node tools/Test-FrontendPlugins.mjs

      - name: Typecheck frontend sources
        working-directory: NexusPipeline-Plugins
        run: npm run typecheck:frontend

      - name: Build frontend modules
        working-directory: NexusPipeline-Plugins
        run: npm run build:frontend

      - name: Test actual host elements with official modules
        working-directory: NexusPipeline
        run: node tests/run.mjs contract

  # managed-code Gate：锁定宿主 checkout、managed-code 构建与测试。
  plugin-managed:
    needs: changes
    if: needs.changes.outputs.managed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: NexusPipeline-Plugins
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read host lock
        id: host-lock
        working-directory: NexusPipeline-Plugins
        env:
          NEXUS_CANDIDATE_HOST_REF: ${{ inputs.host_ref }}
        run: python tools/read_host_lock.py

      - name: Checkout locked host repository
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host-lock.outputs.ref }}
          path: NexusPipeline
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Install frontend workspace
        working-directory: NexusPipeline-Plugins
        run: npm ci --no-audit --no-fund

      - name: Test managed-code plugins
        working-directory: NexusPipeline-Plugins
        run: python tools/repository.py test-managed --full

  # 打包 Gate：受影响的插件测试、发行候选物生成与生成物校验。
  plugin-package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: NexusPipeline-Plugins
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read host lock
        id: host-lock
        working-directory: NexusPipeline-Plugins
        env:
          NEXUS_CANDIDATE_HOST_REF: ${{ inputs.host_ref }}
        run: python tools/read_host_lock.py

      - name: Checkout locked host repository
        uses: actions/checkout@v4
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host-lock.outputs.ref }}
          path: NexusPipeline
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Install frontend workspace
        working-directory: NexusPipeline-Plugins
        run: npm ci --no-audit --no-fund

      - name: Plan and build PR candidate
        working-directory: NexusPipeline-Plugins
        shell: pwsh
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || 'auto' }}
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-NativeSuccess([string]$step) {
            if ($LASTEXITCODE -ne 0) {
              throw "$step 失败，退出码：$LASTEXITCODE"
            }
          }

          $baseline = $env:BASELINE
          if ([string]::IsNullOrWhiteSpace($baseline)) { $baseline = "auto" }

          python tools/repository.py plan --baseline $baseline --output .generated/pr-plan.json
          Assert-NativeSuccess "release planning"
          python tools/repository.py test --plan .generated/pr-plan.json
          Assert-NativeSuccess "affected plugin tests"
          python tools/repository.py release --plan .generated/pr-plan.json --output .generated/pr-candidate
          Assert-NativeSuccess "release candidate generation"
          python tools/repository.py validate-generated --generated-root .generated/pr-candidate
          Assert-NativeSuccess "generated candidate validation"
