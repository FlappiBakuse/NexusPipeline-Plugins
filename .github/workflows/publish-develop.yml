name: Plugins 预览发布

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 构建并提升新预览候选或恢复原始候选
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - restore
      publish:
        description: 通过受保护的发布 App 提升已核验候选
        required: true
        default: false
        type: boolean
      source_ref:
        description: 构建源码引用（通常为 develop）
        required: true
        default: develop
        type: string
      candidate_run_id:
        description: 仅发布恢复使用的原始预览候选运行 ID
        required: false
        type: string
      candidate_artifact_id:
        description: 原始运行包含多个成功候选时使用的产物 ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview-plan:
    name: Plugins / 预览输入
    if: inputs.operation == 'candidate'
    runs-on: windows-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      partner_sha: ${{ steps.plan.outputs.partner_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      managed: ${{ steps.plan.outputs.managed }}
    steps:
      - name: 校验受控 develop来源
        id: develop
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:SOURCE_REF -ne 'develop') { throw 'Preview requires main control and develop source' }
          if ($env:CANDIDATE_RUN_ID -or $env:CANDIDATE_ARTIFACT_ID) { throw 'New preview does not accept recovery inputs' }
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline-Plugins.git refs/heads/develop)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Remote develop is unavailable' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid develop SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: 检出预览控制源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins
          persist-credentials: false
      - name: 检出固定 develop源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.develop.outputs.sha }}
          path: NexusPipeline-Plugins-Source
          persist-credentials: false
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 固定官方宿主 SDK
        id: host
        shell: pwsh
        run: |
          $line = @(git ls-remote https://github.com/FlappiBakuse/NexusPipeline.git refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) { throw 'Cannot resolve official Host main' }
          $sha = ($line[0] -split '\s+')[0]
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Host SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: 检出固定宿主 SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ steps.host.outputs.sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 生成全插件预览计划
        id: plan
        shell: pwsh
        run: >-
          python tools/repo.py release plan --channel preview
          --root ../NexusPipeline-Plugins-Source
          --host-root ../NexusPipeline
          --sdk-sha '${{ steps.host.outputs.sha }}'
          --output .generated/preview-plan-phase.json
          --github-output $env:GITHUB_OUTPUT
      - name: 上传固定预览计划
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline-Plugins/.generated/preview-plan-phase.json
          if-no-files-found: error

  preview-package:
    name: Plugins / 预览插件 · ${{ matrix.artifact }}
    needs: preview-plan
    if: inputs.operation == 'candidate' && needs.preview-plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preview-plan.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - name: 检出预览控制源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins
          persist-credentials: false
      - name: 检出固定 develop源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preview-plan.outputs.source_sha }}
          path: NexusPipeline-Plugins-Source
          persist-credentials: false
      - name: 检出固定宿主 SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ needs.preview-plan.outputs.partner_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 准备受影响插件 Node 工具链
        if: contains(fromJSON(needs.preview-plan.outputs.managed), matrix.artifact)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: 准备受影响插件 .NET 工具链
        if: contains(fromJSON(needs.preview-plan.outputs.managed), matrix.artifact)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: NexusPipeline-Plugins-Source/global.json
      - name: 下载固定预览计划
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plugins-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline-Plugins/.generated/preview-plan-phase
      - name: 构建并验证单插件预览包
        shell: pwsh
        run: >-
          python tools/repo.py package
          --root ../NexusPipeline-Plugins-Source --host-root ../NexusPipeline
          --artifact '${{ matrix.artifact }}'
          --sdk-sha '${{ needs.preview-plan.outputs.partner_sha }}'
          --plan-phase .generated/preview-plan-phase/preview-plan-phase.json
          --output '.generated/preview-package-phase/${{ matrix.artifact }}'
          --report '.generated/preview-package-phase/${{ matrix.artifact }}/report.json'
      - name: 上传单插件预览包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-preview-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.artifact }}
          path: NexusPipeline-Plugins/.generated/preview-package-phase/
          if-no-files-found: error
          retention-days: 14

  build-preview:
    name: Plugins / 预览构建
    needs: [preview-plan, preview-package]
    runs-on: windows-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    outputs:
      source_sha: ${{ needs.preview-plan.outputs.source_sha }}
      workflow_sha: ${{ github.workflow_sha }}
    steps:
      - name: 检出预览控制源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins
          persist-credentials: false
      - name: 检出固定 develop源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preview-plan.outputs.source_sha }}
          path: NexusPipeline-Plugins-Source
          persist-credentials: false
      - name: 检出固定宿主 SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: ${{ needs.preview-plan.outputs.partner_sha }}
          path: NexusPipeline
          persist-credentials: false
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 下载固定预览计划
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plugins-preview-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline-Plugins/.generated/preview-plan-phase
      - name: 下载逐插件预览包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: plugin-preview-package-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: NexusPipeline-Plugins/.generated/preview-package-phases
          merge-multiple: true
      - name: 装配并核验全插件预览候选
        shell: pwsh
        run: |
          python tools/repo.py release assemble --channel preview --root ../NexusPipeline-Plugins-Source --host-root ../NexusPipeline --plan-phase .generated/preview-plan-phase/preview-plan-phase.json --package-phases .generated/preview-package-phases --sdk-sha '${{ needs.preview-plan.outputs.partner_sha }}' --workflow-sha '${{ github.workflow_sha }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --output .generated/preview --producer-output .generated/preview-producer.json
          if ($LASTEXITCODE -ne 0) { throw 'Preview assembly failed' }
          python tools/repo.py release publish --channel preview --generated-root .generated/preview --producer .generated/preview-producer.json --source-root ../NexusPipeline-Plugins-Source --source-sha '${{ needs.preview-plan.outputs.source_sha }}' --workflow-sha '${{ github.workflow_sha }}' --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw 'Preview candidate failed validation' }
      - name: 上传不可变预览候选
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-develop-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            NexusPipeline-Plugins/.generated/preview
            NexusPipeline-Plugins/.generated/preview-producer.json
          if-no-files-found: error
          retention-days: 14

  promote-preview:
    name: Plugins / 预览提升
    needs: build-preview
    if: inputs.operation == 'candidate' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: plugin-preview-publish
    concurrency:
      group: plugin-develop-preview-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - name: 检出发布控制源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build-preview.outputs.workflow_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 1
          persist-credentials: false
      - name: 检出原始预览源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build-preview.outputs.source_sha }}
          path: NexusPipeline-Plugins-Source
          fetch-depth: 1
          persist-credentials: false
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 下载原始预览候选
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plugins-develop-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: NexusPipeline-Plugins/.generated
      - name: 创建发布 App 令牌
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PLUGIN_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-contents: write
      - name: 发布不可变预览事务
        env:
          PLUGIN_PUBLISHER_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ needs.build-preview.outputs.source_sha }}
          WORKFLOW_SHA: ${{ needs.build-preview.outputs.workflow_sha }}
        run: python tools/repo.py release publish --channel preview --generated-root .generated/preview --producer .generated/preview-producer.json --source-root ../NexusPipeline-Plugins-Source --source-sha "$SOURCE_SHA" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --workflow-sha "$WORKFLOW_SHA" --remote-write --token-env PLUGIN_PUBLISHER_TOKEN

  restore-preview:
    name: Plugins / 预览恢复
    if: inputs.operation == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: plugin-preview-publish
    concurrency:
      group: plugin-develop-preview-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - name: 核验 main 控制的恢复输入
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$CANDIDATE_RUN_ID"
          test "$SOURCE_REF" = develop
          test "$PUBLISH" = true
      - name: 检出恢复控制源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 1
          persist-credentials: false
      - name: 准备 Python 工具链
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: 定位原始成功构建与候选产物
        id: original
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          args=(--candidate-run-id "$CANDIDATE_RUN_ID" --current-run-id "$GITHUB_RUN_ID" --github-output "$GITHUB_OUTPUT")
          if [[ -n "$CANDIDATE_ARTIFACT_ID" ]]; then args+=(--artifact-id "$CANDIDATE_ARTIFACT_ID"); fi
          python tools/repo.py release source --channel preview "${args[@]}"
      - name: 下载原始候选产物
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.original.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.original.outputs.artifact_digest }}
        run: |
          mkdir -p .generated
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
            --output .generated/preview-artifact.zip \
            "https://api.github.com/repos/FlappiBakuse/NexusPipeline-Plugins/actions/artifacts/$ARTIFACT_ID/zip"
          python tools/repo.py release extract --channel preview --artifact-zip .generated/preview-artifact.zip \
            --expected-digest "$ARTIFACT_DIGEST" --output .generated/preview-restore
      - name: 核验候选源码身份
        id: source
        run: >-
          python tools/repo.py release inspect --channel preview
          --generated-root .generated/preview-restore/preview
          --producer .generated/preview-restore/preview-producer.json
          --workflow-sha '${{ steps.original.outputs.workflow_sha }}'
          --run-id '${{ steps.original.outputs.run_id }}'
          --run-attempt '${{ steps.original.outputs.run_attempt }}'
          --github-output "$GITHUB_OUTPUT"
      - name: 检出原始预览源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: NexusPipeline-Plugins-Source
          fetch-depth: 1
          persist-credentials: false
      - name: 核验原始源码、候选与构建
        run: >-
          python tools/repo.py release publish --channel preview
          --generated-root .generated/preview-restore/preview
          --producer .generated/preview-restore/preview-producer.json
          --source-root ../NexusPipeline-Plugins-Source
          --source-sha '${{ steps.source.outputs.source_sha }}'
          --workflow-sha '${{ steps.original.outputs.workflow_sha }}'
          --run-id '${{ steps.original.outputs.run_id }}'
          --run-attempt '${{ steps.original.outputs.run_attempt }}'
      - name: 创建发布 App 令牌
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PLUGIN_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-contents: write
      - name: 发布已核验的原始预览包
        env:
          PLUGIN_PUBLISHER_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python tools/repo.py release publish --channel preview
          --generated-root .generated/preview-restore/preview
          --producer .generated/preview-restore/preview-producer.json
          --source-root ../NexusPipeline-Plugins-Source
          --source-sha '${{ steps.source.outputs.source_sha }}'
          --workflow-sha '${{ steps.original.outputs.workflow_sha }}'
          --run-id '${{ steps.original.outputs.run_id }}'
          --run-attempt '${{ steps.original.outputs.run_attempt }}'
          --remote-write --token-env PLUGIN_PUBLISHER_TOKEN
