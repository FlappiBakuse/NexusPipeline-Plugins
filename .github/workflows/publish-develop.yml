name: Build develop preview candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref to build (normally develop)
        required: true
        default: develop
        type: string

permissions:
  contents: read

jobs:
  build-preview:
    name: preview-build
    runs-on: windows-latest
    concurrency:
      group: plugin-develop-preview-build
      cancel-in-progress: true
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
    steps:
      - name: Require controlled develop source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: test "$SOURCE_REF" = develop
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          path: NexusPipeline-Plugins
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.424"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FlappiBakuse/NexusPipeline
          ref: main
          path: NexusPipeline
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve immutable source identity
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "source ref 未解析为完整 SHA" }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "workflow_sha=$env:GITHUB_WORKFLOW_SHA" >> $env:GITHUB_OUTPUT
      - name: Build and validate preview candidate
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python tools/repository.py publish-develop --source-ref "$env:SOURCE_SHA" --output .generated\preview --producer-output .generated\preview-producer.json --host-root ..\NexusPipeline --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT" --workflow-sha "$env:GITHUB_WORKFLOW_SHA"
      - name: Upload immutable local candidate for separately authorized promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugins-develop-preview-${{ steps.source.outputs.sha }}
          path: |
            NexusPipeline-Plugins/.generated/preview
            NexusPipeline-Plugins/.generated/preview-producer.json
          if-no-files-found: error
          retention-days: 14

  promote-preview:
    name: preview-publish
    needs: build-preview
    runs-on: ubuntu-latest
    environment: plugin-preview-publish
    concurrency:
      group: plugin-develop-preview-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: NexusPipeline-Plugins
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build-preview.outputs.workflow_sha }}
          path: NexusPipeline-Plugins
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plugins-develop-preview-${{ needs.build-preview.outputs.source_sha }}
          path: NexusPipeline-Plugins/.generated
      - name: Create publisher App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ vars.PLUGIN_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PLUGIN_PUBLISHER_PRIVATE_KEY }}
          owner: FlappiBakuse
          repositories: NexusPipeline-Plugins
          permission-contents: write
      - name: Publish immutable preview transaction
        env:
          PLUGIN_PUBLISHER_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ needs.build-preview.outputs.source_sha }}
          WORKFLOW_SHA: ${{ needs.build-preview.outputs.workflow_sha }}
        run: python tools/repository.py publish-preview --generated-root .generated/preview --producer .generated/preview-producer.json --source-sha "$SOURCE_SHA" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --workflow-sha "$WORKFLOW_SHA" --remote-write --token-env PLUGIN_PUBLISHER_TOKEN
